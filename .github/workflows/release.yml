name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        
      - name: install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
      
      - name: Name the download
        run: cp dist/index.html product-watermarker.html

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: product-watermarker.html
          generate_release_notes: true